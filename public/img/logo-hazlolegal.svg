<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 76" width="232" height="76" role="img" aria-label="HazloLegal">
  <title>HazloLegal</title>
  <!-- textLength fija el ancho del texto: sin eso, cada visor con otra
       fuente desplaza la palabra fuera del bloque del marcador. -->
  <text x="4" y="48" textLength="100" lengthAdjust="spacingAndGlyphs"
        font-family="Plus Jakarta Sans, Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#10151F">Hazlo</text>
  <g transform="rotate(-2 166 40)">
    <rect x="110" y="20" width="112" height="40" rx="9" fill="#1D4ED8"/>
    <text x="166" y="48" text-anchor="middle" textLength="100" lengthAdjust="spacingAndGlyphs"
          font-family="Plus Jakarta Sans, Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="34" font-weight="800" fill="#FFFFFF">Legal</text>
  </g>
</svg>
